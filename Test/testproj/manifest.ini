[project]
name = TestProject
output = build\out.exe
cl = cl.exe
link = link.exe
objdir = build\obj
linkflags = /NOLOGO

[defaults]
flags = /EHsc /nologo
defines = TEST_DEFAULT_DEFINE
includes = include

[file: src/main.cpp]
flags = /O2
defines = MAIN_FILE_DEFINE
includes = include

[file: src/util.cpp]
flags = /Od
defines = UTIL_FILE_DEFINE
includes = include
