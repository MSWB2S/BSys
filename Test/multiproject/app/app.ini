[project]
name=app
output=build\app.exe
cl=cl.exe
link=link.exe
rc=rc.exe
objdir=build\obj
linkflags=/NOLOGO ..\mathlib\build\mathlib.lib
pdb=build\app.pdb
verbosity=normal
message=${company}: Building ${name}.exe (links mathlib.dll)

[variables]
company=NoJuo

[defaults]
flags=/EHsc /std:c++17
includes=include;..\mathlib\include

[file:src\main.cpp]
compile_msg=[CC] app -> ${object}

[file:src\app.rc]
compile_msg=[RC] app -> ${object}
