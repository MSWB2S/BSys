[project]
name=mathlib
output=build\mathlib.dll
cl=cl.exe
link=link.exe
objdir=build\obj
linkflags=/NOLOGO /DLL /IMPLIB:build\mathlib.lib
pdb=build\mathlib.pdb
verbosity=normal
message=${company}: Building ${name}.dll

[variables]
company=NoJuo

[defaults]
flags=/EHsc /std:c++17
defines=MATHLIB_EXPORTS
includes=include

[file:src\mathlib.cpp]
compile_msg=[CC] mathlib -> ${object}
