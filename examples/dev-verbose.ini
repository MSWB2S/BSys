; Everything turned up: symbols on, custom per-file messages,
; and verbosity=all so nothing is ever hidden.

[project]
name=WBSys
output=build\WBSys.exe
cl=cl.exe
link=link.exe
objdir=build\obj
linkflags=/NOLOGO
pdb=build\WBSys.pdb
verbosity=all
message=${company}: Building ${name} ${version} (${configuration}) for ${architecture}

[variables]
company=NoJuo
version=1.0
configuration=Debug
architecture=amd64

[defaults]
flags=/EHsc /std:c++17 /W4
defines=WIN32;_DEBUG
includes=include

[file:src\main.cpp]
compile_msg=[CC] Compiling ${file} -> ${object}

[file:src\builder.cpp]
compile_msg=[CC] Compiling ${file} -> ${object}

[file:src\manifest.cpp]
compile_msg=[CC] Compiling ${file} -> ${object}

[file:src\process.cpp]
flags=/wd4996
compile_msg=[CC] Compiling ${file} -> ${object} (legacy Windows API)

[file:src\utility.cpp]
