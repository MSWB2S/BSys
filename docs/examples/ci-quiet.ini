; CI-friendly: silent on success, full compiler diagnostics on failure.
; No pdb= — CI builds a release artifact, not something you'll step through.

[project]
name=WBSys
output=build\WBSys.exe
objdir=build\obj
verbosity=errors
message=CI build: ${name} ${version}

[variables]
version=1.0

[defaults]
flags=/EHsc /std:c++17 /O2 /MD /WX

[file:src\main.cpp]
[file:src\builder.cpp]
[file:src\manifest.cpp]
[file:src\process.cpp]
[file:src\utility.cpp]
